<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3D6E9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menú">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Menú de la Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Azul calmo: gris azulado muy claro, un azul suave como único acento; mucho aire, pocos bordes. Outfit para títulos, Manrope para el resto. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --sunk:#E8EEF3; --line:#DEE5EC;
  --fg:#1F2933; --muted:#62707E; --accent:#3D6E9E; --accent-fg:#FFFFFF; --accent-soft:#E3EDF7; --red:#B8443A;
  --dish:#F5F8FB; --dish-line:#DEE5EC; --salsa:#FBEEEA; --salsa-line:#EBC9C0; --salsa-fg:#9C3B31; --gua:#E9F3EC; --gua-line:#BFD9C7; --gua-fg:#2F6B45;
  --amber:#8A5A12; --amber-soft:#FBF1DC; --ice:#2B6F6A; --ice-soft:#E2F1EF;
  --ok:#3B7A5A; --warn:#A6402F; --danger:#B3261E; --star:#C2453A;
  --display:"Outfit", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1A2129; --sunk:#222B35; --line:#33404D;
  --fg:#E6ECF2; --muted:#9AA7B4; --accent:#8DB8E3; --accent-fg:#0F1820; --accent-soft:#1E2C3A; --red:#E8857A;
  --dish:#1E2630; --dish-line:#33404D; --salsa:#2E1F1E; --salsa-line:#6B3C36; --salsa-fg:#F0A99E; --gua:#1C2B22; --gua-line:#3C6149; --gua-fg:#9ED3B1;
  --amber:#E8C88E; --amber-soft:#2A2214; --ice:#8FD3CB; --ice-soft:#183230;
  --ok:#86C2A0; --warn:#F0A99E; --danger:#F08A80; --star:#EF8478; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1A2129; --sunk:#222B35; --line:#33404D;
  --fg:#E6ECF2; --muted:#9AA7B4; --accent:#8DB8E3; --accent-fg:#0F1820; --accent-soft:#1E2C3A; --red:#E8857A;
  --dish:#1E2630; --dish-line:#33404D; --salsa:#2E1F1E; --salsa-line:#6B3C36; --salsa-fg:#F0A99E; --gua:#1C2B22; --gua-line:#3C6149; --gua-fg:#9ED3B1;
  --amber:#E8C88E; --amber-soft:#2A2214; --ice:#8FD3CB; --ice-soft:#183230;
  --ok:#86C2A0; --warn:#F0A99E; --danger:#F08A80; --star:#EF8478; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
h1::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
header.top{border-bottom:2px solid var(--line)}
.btn.primary:hover{filter:brightness(1.06)}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.serv{display:flex;align-items:center;gap:8px;font-weight:600}
.serv .num{min-width:2ch;text-align:center;font-size:1.2rem;font-variant-numeric:tabular-nums}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.1rem;cursor:pointer;line-height:1}
.status{font-size:.78rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .9rem var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 10px;font-size:.82rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px}
.toolbar h2{margin-right:auto}
select,input,textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.hint{font-size:.82rem;color:var(--muted)}
/* MENÚ */
.week{display:grid;gap:10px}
.day{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.day .dname{font-family:var(--display);font-size:1.15rem;padding-top:6px}
.meal{display:grid;gap:6px;min-width:0}
.meal .lbl{display:flex;justify-content:space-between;align-items:center}
.pick{display:flex;gap:6px;align-items:center}
.pick select.dish{background:var(--dish);border-color:var(--dish-line);font-weight:600}
#fName{font-weight:600}
.pick select.salsa{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.pick select.salsa.has{background:var(--salsa);border:1px solid var(--salsa-line);color:var(--salsa-fg);font-weight:600}
.pick select.salsa.has.gua{background:var(--gua);border-color:var(--gua-line);color:var(--gua-fg)}
.autonote::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.autonote:empty::before{display:none}
.open{border:0;background:transparent;color:var(--accent);font:600 .8rem var(--body);cursor:pointer;white-space:nowrap;padding:4px}
.daynotes{grid-column:2 / -1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.autonote{font-size:.82rem;color:var(--muted);font-style:italic;min-height:1em}
.preps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;margin-top:14px}
.preps .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.prepbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;margin-top:16px}
.preplist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.preplist li{display:flex;align-items:center;gap:8px;background:var(--salsa);border:1px solid var(--salsa-line);color:var(--salsa-fg);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;font-size:.9rem}
.preplist li .x{border:0;background:transparent;color:var(--salsa-fg);cursor:pointer;font-size:1.05rem;line-height:1;padding:2px 6px;border-radius:50%}
.preplist li .open{color:var(--salsa-fg);text-decoration:underline;padding:2px}
.prepadd{max-width:360px}
@media (max-width:760px){
  .day{grid-template-columns:1fr}
  .day .dname{padding:0}
  .daynotes{grid-column:auto;grid-template-columns:1fr}
}
/* COMPRAS */
.shopgrid{columns:300px;column-gap:12px}
.shopgrid .shop{break-inside:avoid;margin-bottom:12px}
.shop h3 .cnt{font-variant-numeric:tabular-nums}
.pantry{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.pantry span{background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:.82rem}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;align-content:start}
.scard .nm{font-family:var(--display);font-size:1.05rem}
.scard ul{margin:0;padding-left:18px;font-size:.82rem;color:var(--muted)}
.scard .acts{display:flex;flex-wrap:wrap;gap:6px}
.saveform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border-radius:var(--r);padding:10px;margin-bottom:12px}
.saveform input{max-width:320px}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.shop h3{margin-bottom:6px;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--sunk);cursor:pointer}
.item:first-of-type{border-top:0}
.item input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.item .q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .u{font-size:.76rem;color:var(--muted)}
.item.done .n,.item.done .q{text-decoration:line-through;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;background:var(--sunk);border-radius:var(--r);padding:10px 14px}
.summary b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.wa{display:grid;gap:8px;margin-top:14px}
.wa textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;min-height:180px}
/* RECETAS */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .8rem var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.reclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--fg);font:inherit}
.rcard .cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rcard .cat.s{color:var(--salsa-fg)}
.rcard .nm{font-family:var(--display);font-size:1.05rem}
.rcard .meta{font-size:.8rem;color:var(--muted)}
.rcard{position:relative}
.rcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.star{border:0;background:transparent;cursor:pointer;font-size:1.35rem;line-height:1;color:var(--muted);padding:0 2px}
.star[aria-pressed="true"]{color:var(--star)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--dish);color:var(--fg);border:1px solid var(--dish-line)}
.badge.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;width:min(860px,100%);padding:18px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .head{display:flex;gap:10px;align-items:center}
.modal .head h2{margin-right:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.pre{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.9rem}
.items{display:grid;gap:6px}
.irow{display:grid;grid-template-columns:1fr 90px 70px 34px;gap:6px;align-items:center}
.irow .unit{font-size:.82rem;color:var(--muted)}
.confirm{background:var(--sunk);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.err{color:var(--danger);font-size:.85rem;font-weight:600}
/* PRODUCTOS */
.ptable{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:6px 8px;border-bottom:1px solid var(--sunk);text-align:left;vertical-align:middle}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.uses{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:640px){header.top{position:static}body::before{display:none}h1{font-size:1.3rem}}
.basebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:10px 14px}
.basebar > div{flex:1;min-width:220px}
.basebar.ok{border-left-color:var(--ok)}
.basebar.warn{border-left-color:var(--red);background:var(--salsa)}
.catsec{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.catadd{display:flex;gap:8px}
.catadd input{flex:1}
.catlist{display:grid;gap:6px}
.catrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px}
.catrow.warn{background:var(--salsa)}
.catrow.fixed{grid-template-columns:1fr;background:transparent;border:1px dashed var(--line)}
.catrow .cn{font-weight:700}
.catrow input{min-width:0}
@media (max-width:520px){.catrow{grid-template-columns:1fr auto auto}.catrow .hint{display:none}}
.remindbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.remindbox ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.remind{font-size:.82rem;color:var(--salsa-fg);font-weight:600;margin-top:3px}
.brand{font-size:.86em;color:var(--muted)}
.ptable input.sm{max-width:110px;min-width:90px}
.ptable input.pname{min-width:240px}.ptable input.pbrand{min-width:240px}
.ptable select[data-pf="shop"]{min-width:300px}.ptable select[data-pf="unit"]{min-width:100px}.ptable input[data-pf="plural"]{min-width:100px}
.planbox{background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.planrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.planrow>.hint:first-child{min-width:78px}
.pick .dice{padding:4px 6px}
.jumbo{font:600 .72rem var(--body);color:var(--accent);text-decoration:none;white-space:nowrap}.jumbo:hover{text-decoration:underline}
.jumbohelp{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;margin:10px 0}
.price{font:700 .78rem var(--body);color:var(--ink)}
.jline{opacity:.85}
.jumbobox{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:10px 14px;background:var(--card)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:8px 12px;font:600 .9rem var(--body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.snackgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.snackcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.snackcol h3{margin:0;text-transform:none;letter-spacing:0;font:400 1.15rem var(--display);color:var(--ink)}
.snackrow{width:100%;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.snackline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.snackline select:first-child{flex:1}
.snackline .x{border:0;background:none;font-size:1.2rem;color:var(--muted);cursor:pointer}
button.schip{cursor:pointer;font-family:inherit}
.item.stockrow{grid-template-columns:1fr auto;cursor:default}
.mpbox{border-left-color:#B07A2C}
.mplist li{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--fg);font-weight:400;width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.mplist li.done .mpn{opacity:.7}.mplist li .open{color:var(--accent)}.mplist li .x{color:var(--muted)}.mpn{display:flex;gap:6px;align-items:baseline;font-weight:600;margin-right:auto}
.mpt{display:flex;gap:6px;align-items:center}.mplow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.mpinfo{background:#FBF3E6;border:1px solid #E7CFA4;color:#6E4A12;border-radius:var(--r);padding:8px 12px;font-size:.9rem;margin:6px 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mpinfo{background:#2A2214;border-color:#5E4A24;color:#E8C88E}}
:root[data-theme="dark"] .mpinfo{background:#2A2214;border-color:#5E4A24;color:#E8C88E}
.mpstock{margin-top:14px}.mptable{display:grid;gap:0}
.mprow{display:grid;grid-template-columns:minmax(0,1fr) auto 96px 130px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.mpq{display:flex;gap:6px;align-items:center}.mpq b{min-width:1.6em;text-align:center}
.mpst{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;text-align:center}
.mpst.ok{background:var(--gua);color:var(--gua-fg)}.mpst.low{background:var(--amber-soft);color:var(--amber)}.mpst.out{background:var(--sunk);color:var(--muted)}
@media (max-width:640px){.mprow{grid-template-columns:1fr auto;}.mprow .mpname{grid-column:1/-1}}
.mpform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.mpform input{width:auto;max-width:200px}.mpform #fMpQ,.mpform #fMpMin{max-width:80px}
.fzfacts{display:grid;gap:3px;background:#EEF4FA;border:1px solid #C9DCEE;color:#24496E;border-radius:var(--r);padding:10px 12px;font-size:.92rem}
.fzfacts.no{background:var(--sunk);border-color:var(--line);color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fzfacts:not(.no){background:#18222D;border-color:#34506B;color:#BCD6EE}}
:root[data-theme="dark"] .fzfacts:not(.no){background:#18222D;border-color:#34506B;color:#BCD6EE}
.fzform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;margin-top:8px}.fzform .wide{grid-column:1/-1}.fzform .vchk{grid-column:1/-1}
@media (max-width:640px){.fzform{grid-template-columns:1fr}}
.fzrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fzchip{font:inherit;font-size:.78rem;border:1px dashed #8DB3D9;background:transparent;color:#2D5F8F;border-radius:999px;padding:3px 10px;cursor:pointer}
.fzchip[aria-pressed="true"]{background:#E6F0FA;border-style:solid;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fzchip{color:#9CC3EA;border-color:#4E6F92}:root:not([data-theme="light"]) .fzchip[aria-pressed="true"]{background:#1C2836}}
:root[data-theme="dark"] .fzchip{color:#9CC3EA;border-color:#4E6F92}:root[data-theme="dark"] .fzchip[aria-pressed="true"]{background:#1C2836}
.vwarn{font-size:.75rem;color:var(--warn);font-weight:600}

function srvPush(force){

async function connectSrv(){

    if (r.status === 401) { srv.key = ""; try { localStorage.removeItem(LS_SRVKEY); } catch (e) {} msg = "Clave incorrecta. Probá de nuevo."; continue; }

function saveRecipe(){
  readDraft();
  const d = modal.draft;
  if (!d.name) { modal.error = "Poné un nombre."; return renderModal(); }
  if (d.cat === "__new") {
    const nc = (d.newCat || "").trim();
    if (!nc) { modal.error = "Escribí el nombre de la categoría nueva."; return renderModal(); }
    d.cat = addCategory(nc);
  }
  delete d.newCat;
  if (state.recipes.some(r => r.id !== d.id && r.name.toLowerCase() === d.name.toLowerCase())) { modal.error = "Ya hay una receta con ese nombre."; return renderModal(); }
  d.rows = d.rows.filter(x => x.name || x.p).map(x => ({q: x.q === null || isNaN(x.q) ? null : x.q, u: x.p ? "" : (x.u || ""), name: x.name || (x.p ? prodById(x.p).name.toLowerCase() : ""), p: x.p || null}));
  if (!d.prev || !d.prev.when) d.prev = {when: "", text: d.prev ? d.prev.text : ""};
  else if (!d.prev.text) { modal.error = "Contá qué hay que hacer antes (ej.: poner en remojo)."; return renderModal(); }
  if (d.id) { const i = state.recipes.findIndex(r => r.id === d.id); state.recipes[i] = d; }
  else { d.id = newId("r", state.recipes); state.recipes.push(d); }
  // si cambió de tipo (plato <-> salsa), sacarla de lugares incompatibles
  state.days.forEach(day => {
    for (const f of ["lunch","dinner"]) if (day[f] === d.id && isSide(d)) day[f] = null;
    for (const f of ["lunchSalsa","dinnerSalsa"]) if (day[f] === d.id && !isSide(d)) day[f] = null;
  });
  state.preps = state.preps.filter(p => !(p === d.id && (!isSalsa(d) || d.special)));
  if (d.special) state.days.forEach(day => ["lunch","lunchSalsa","dinner","dinnerSalsa"].forEach(f => { if (day[f] === d.id) day[f] = null; }));
  save(); modal.edit = false; modal.id = d.id; modal.draft = clone(d); modal.error = ""; renderModal(); render(); toast("Receta guardada");
}
function deleteRecipe_extra(id){ state.extra = state.extra.filter(x => x.rid !== id); }
function deleteRecipe(){
  const id = modal.draft.id;

function cookClick(t){

  if (t.id === "ckNext") { cook.step = Math.min(total - 1, cook.step + 1); renderCook(); $(".ck-main")?.scrollTo(0, 0); return true; }
  if (t.id === "ckPrev") { cook.step = Math.max(0, cook.step - 1); renderCook(); return true; }
  if (t.id === "ckPm" || t.id === "ckPp") { cook.people = Math.max(1, Math.min(200, cook.people + (t.id === "ckPp" ? 1 : -1))); renderCook(); return true; }

  if (t.dataset.tdis) { cook.timers = cook.timers.filter(y => y.id !== t.dataset.tdis); renderCook(); return true; }
  if (t.id === "ckTimer") { cook.askTimer = true; renderCook(); $("#ckMins")?.select(); return true; }
  if (t.id === "ckTimerNo") { cook.askTimer = false; renderCook(); return true; }
  if (t.id === "ckTimerGo") { const m = Number($("#ckMins").value); const n = ($("#ckTn").value || "").trim() || "Temporizador"; cook.askTimer = false; if (m > 0) addTimer(m, n); else renderCook(); return true; }

  if (t.id === "ckClockGo") { cook.clockStart = Date.now(); cook.firedTl = new Set(); renderCook(); return true; }
  if (t.id === "ckClockStop") { cook.clockStart = null; renderCook(); return true; }
  return false;
}

      if (!v) { t.value = p.name; return toast("El nombre no puede quedar vacío"); }
      if (state.products.some(x => x.id !== p.id && x.name.toLowerCase() === v.toLowerCase())) { t.value = p.name; return toast("Ya existe un producto con ese nombre"); }
    }
    if (f === "packSize") { const n = Number(v.replace(",", ".")); p.packSize = n > 0 ? n : null; save(); render(); return; }
    p[f] = v; if (f === "unit" && (v === "g" || v === "ml")) p.plural = v;
    save(); render(); return;
  }
  if (t.id === "fileIn" && t.files[0]) {
    const file = t.files[0];
    if (/\.json$/i.test(file.name) || file.type === "application/json") {
      const fr = new FileReader();
      fr.onload = () => { try { pendingImport = importBase(fr.result); showImportConfirm(pendingImport); } catch (err) { toast(err.message); } };
      fr.readAsText(file); return;
    }
    if (!window.XLSX) return toast("No se pudo cargar el lector de Excel. Revisá la conexión.");
    const fr = new FileReader();
    fr.onload = () => {
      try { const wb = XLSX.read(fr.result, {type:"array"}); pendingImport = importWorkbook(wb); showImportConfirm(pendingImport); }
      catch (err) { toast(err.message || "No pude leer el archivo"); }
    };
    fr.readAsArrayBuffer(t.files[0]);
  }
});
let notesT = null;
document.addEventListener("input", e => {
  if (e.target.id === "prodQ") { prodQ = e.target.value; render(); const i = $("#prodQ"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  const t = e.target;
  if (t.dataset.notes !== undefined) { state.days[+t.dataset.notes].notes = t.value; clearTimeout(notesT); notesT = setTimeout(save, 500); }
  if (t.id === "recSearch") { recFilter.q = t.value; const pos = t.selectionStart; render(); const s = $("#recSearch"); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", e => {
  if (superMode && e.key === "Escape") { closeSuper(); return; }
  if (e.key === "Escape" && !modal && !cook && (openMenu || sheet)) { if (openMenu) { openMenu = null; render(); } else closeSheet(); return; }
  if (cook) {
    if (e.key === "Escape") { closeCook(); return; }
    if (e.target.tagName === "INPUT") { if (e.key === "Enter" && (e.target.id === "ckMins" || e.target.id === "ckTn")) $("#ckTimerGo")?.click(); return; }
    if (e.key === "ArrowRight") { $("#ckNext")?.click(); return; }
    if (e.key === "ArrowLeft") { $("#ckPrev")?.click(); return; }
    return;
  }
  if (e.key === "Escape" && calcMenu) { calcMenu = false; render(); return; }
  if (e.key === "Escape" && (calc || asado || gcalc)) { closeCalc(); return; }
  if (e.key === "Escape" && modal) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("rcard")) { e.preventDefault(); openRecipe(e.target.dataset.open); }
  if (e.key === "Enter" && e.target.id === "saveName") $("#doSave").click();
  if (e.key === "Enter" && e.target.id === "catNew") $("#catAdd").click();
  if (e.key === "Enter" && e.target.id === "tagNew") $("#tagAdd").click();
  if (e.key === "Enter" && e.target.id === "fTagNew") { e.preventDefault(); $("#addTag").click(); }
  if (e.key === "Enter" && e.target.id === "haveIn") { e.preventDefault(); document.querySelector("[data-havesave]")?.click(); }
  if (e.key === "Enter" && e.target.id === "catRen") document.querySelector("[data-catsave]")?.click();
});

/* ---------- inicio ---------- */
(function start(){
  let saved = null; try { saved = JSON.parse(lsGet(LS_KEY) || "null"); } catch(e) {}
  state = normalize(saved || clone(DEFAULT));
  { const mv = lsGet("menu-casa-menuview"); if (mv === "snacks") menuView = mv; }
  const t = lsGet(LS_TAB); if (t === "ocasiones") tab = "especiales"; else if (TABS.includes(t)) tab = t;
  render();
  connectDb().then(async () => { if (dref) return; if (await connectSrv()) return; return initFileBase(); });
})();
